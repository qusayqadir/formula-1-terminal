name: dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (stub — always passes)
    runs-on: ubuntu-latest
    steps:

      - name: No tests
        run: echo "No tests to run — passing."

  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  deploy-frontend:
    name: build frontend and deploy to s3
    needs: [test, changes]
    # Only deploy to S3 when the push actually touched the frontend.
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync build output to S3
        run: aws s3 sync frontend/dist s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  bundle:
    name: build release bundle
    needs: test
    runs-on: ubuntu-latest
    outputs:
      bundle_name: ${{ steps.name.outputs.bundle_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute bundle name
        id: name
        run: |
          BUNDLE_NAME="release-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "bundle_name=${BUNDLE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Release bundle: ${BUNDLE_NAME}"

      # The bundle = every artifact prod needs to push to AWS:
      #   → ECR image 
      #   - Lambda consumer function code
      #   - lambda_orchestrator_fargate.py → orchestrator Lambda
      #   - task-definition.json → ECS task def (registered on promote)
      - name: Package release bundle
        id: pack
        run: |
          BUNDLE_NAME="${{ steps.name.outputs.bundle_name }}"
          tar -czf "${BUNDLE_NAME}.tar.gz" \
            app/pipeline/live/producer \
            app/pipeline/live/consumers \
            app/pipeline/live/lambda_orchestrator_fargate.py \
            requirements.txt
          echo "Built ${BUNDLE_NAME}.tar.gz"
          ls -la "${BUNDLE_NAME}.tar.gz"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.bundle_name }}
          path: ${{ steps.name.outputs.bundle_name }}.tar.gz
          retention-days: 30

      - name: Promotion instructions
        run: |
          {
            echo "## Release bundle ready"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| bundle_name | \`${{ steps.name.outputs.bundle_name }}\` |"
            echo "| run_id | \`${{ github.run_id }}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo ""
            echo "**To promote to prod:** run the **prod** workflow"
            echo "(Actions → prod → Run workflow) with the \`bundle_name\`"
            echo "and \`run_id\` above."
          } >> "$GITHUB_STEP_SUMMARY"
